<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuşatma</title>
<meta name="robots" content="noindex">
<script>(function () { var p = location.pathname, i = p.indexOf('/oyun'); if (i >= 0) location.replace(p.slice(0, i + 1) + '?r=' + encodeURIComponent(p.slice(i + 1).replace(/\/$/, '')) + (location.search ? '&' + location.search.slice(1) : '') + location.hash); })();</script>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#0d110f;color:#ece6d6;font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;box-sizing:border-box}a{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:12px;background:#ff6b2c;color:#1c0c03;font-weight:700;text-decoration:none}p{color:#9aa496;margin:0}</style>
</head>
<body><main><h1 style="margin:0 0 6px">Sayfa bulunamadı</h1><p>Aradığın sayfa burada değil.</p><a id="home" href="./">Kuşatma'ya dön</a></main>
<script>(function () { var p = location.pathname, i = p.indexOf('/kusatma/'); document.getElementById('home').href = i >= 0 ? p.slice(0, i + 9) : '/'; })();</script>
</body>
</html>
